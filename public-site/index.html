<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>塔卫二档案库</title>
  <style>
    :root {
      --bg: #0c1014;
      --bg-2: #12181e;
      --bg-3: #1a222b;
      --line: #2c3844;
      --text: #d7dde5;
      --muted: #8b97a5;
      --gold: #c9a15b;
      --gold-dim: rgba(201, 161, 91, 0.14);
      --cyan: #6eb8c9;
      --link: #8ec4d6;
      --red: #d08080;
      --sidebar: 300px;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    button, input { font: inherit; }
    a { color: var(--link); }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
      min-height: 100dvh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-2);
      z-index: 30;
    }
    .brand {
      color: var(--gold);
      font-weight: 650;
      letter-spacing: 0.12em;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
    }
    .brand:hover { color: #e0c07a; }
    .search-wrap { flex: 1; min-width: 0; position: relative; max-width: 520px; }
    .search-wrap input {
      width: 100%;
      height: 34px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      padding: 0 10px;
      outline: none;
    }
    .search-wrap input:focus { border-color: var(--gold); }
    .search-drop {
      display: none;
      position: absolute;
      left: 0; right: 0; top: calc(100% + 4px);
      max-height: 320px;
      overflow: auto;
      background: var(--bg-3);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 40;
    }
    .search-drop.open { display: block; }
    .search-drop .hit {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--line);
    }
    .search-drop .hit:hover, .search-drop .hit.active { background: var(--gold-dim); }
    .search-drop .t { font-size: 13px; color: var(--gold); }
    .search-drop .s { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { color: var(--text); border-color: #3d4c5a; }
    .btn.primary { color: var(--gold); border-color: var(--gold); }
    .btn.primary:hover { background: var(--gold-dim); }
    .btn-icon {
      width: 36px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 18px;
      line-height: 1;
    }

    .body {
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
      min-height: 0;
      position: relative;
    }
    .app.sidebar-collapsed .body { grid-template-columns: 0 1fr; }
    aside {
      background: var(--bg-2);
      border-right: 1px solid var(--line);
      overflow: auto;
      padding: 12px;
      min-width: 0;
      transition: transform 0.2s ease, width 0.2s ease;
    }
    .app.sidebar-collapsed aside {
      overflow: hidden;
      padding: 0;
      border-right: none;
    }
    .sec-label {
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--muted);
      padding: 8px 6px 6px;
      text-transform: uppercase;
    }
    .sec-label.fold {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .sec-label.fold .chev { color: var(--gold); width: 10px; font-size: 10px; }
    .sec-label.fold.collapsed .chev { transform: rotate(-90deg); display: inline-block; }
    .filter-panel {
      margin: 0 2px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0,0,0,.15);
      overflow: hidden;
    }
    .filter-panel > .sec-label.fold {
      margin: 0;
      padding: 10px;
      color: var(--gold);
    }
    .filter-panel-body { padding: 0 4px 8px; border-top: 1px solid var(--line); }
    .filter-panel-body.collapsed { display: none; }
    .filter-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 6px;
      flex-wrap: wrap;
    }
    .mode-switch {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    .mode-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .mode-btn.on {
      background: var(--bg-3);
      color: var(--gold);
    }
    .clear-link {
      font-size: 12px;
      color: var(--gold);
      cursor: pointer;
      user-select: none;
    }
    .clear-link:hover { text-decoration: underline; }
    .clear-link[hidden] { display: none !important; }
    .filter-hint {
      font-size: 11px;
      color: var(--muted);
      padding: 0 8px 8px;
      line-height: 1.45;
    }
    .filter-banner {
      display: none;
      font-size: 12px;
      color: var(--muted);
      background: var(--gold-dim);
      border: 1px solid rgba(201,161,91,.35);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .filter-banner.show { display: block; }
    .filter-banner b { color: var(--gold); font-weight: 600; }
    .filter-list { max-height: 180px; overflow: auto; margin-bottom: 6px; }
    .filter-list.collapsed { display: none; }
    .filter-list {
      scrollbar-width: thin;
      scrollbar-color: var(--gold) #0a0c0e;
    }
    .tag-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .tag-row:hover { background: var(--bg-3); }
    .tag-row.on { background: var(--gold-dim); }
    .tag-row .nm { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-row.on .nm { color: var(--gold); }
    .tag-row .n { color: var(--gold); font-size: 11px; }
    .page-item {
      padding: 6px 8px 6px calc(10px + var(--depth, 0) * 14px);
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-item:hover { background: var(--bg-3); }
    .page-item.on { background: var(--gold-dim); color: var(--gold); }
    .empty { color: var(--muted); font-size: 12px; padding: 6px; }

    main {
      min-width: 0;
      overflow: auto;
      padding: 24px 28px calc(48px + var(--safe-bottom));
      background:
        radial-gradient(1000px 360px at 20% -10%, rgba(201,161,91,.06), transparent 55%),
        var(--bg);
    }
    .crumb { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .doc-title {
      font-size: clamp(24px, 4vw, 32px);
      color: var(--gold);
      font-weight: 650;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
    .meta i { color: var(--gold); font-style: normal; }
    .tag-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tag {
      font-size: 12px;
      border: 1px solid;
      border-radius: 999px;
      padding: 2px 8px;
      cursor: pointer;
    }
    .doc h1 { font-size: 22px; color: var(--gold); margin: 1em 0 .4em; }
    .doc h2 { font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 1.2em 0 .5em; }
    .doc h3 { font-size: 16px; color: var(--cyan); margin: 1em 0 .4em; }
    .doc p { margin: 0.7em 0; }
    .doc ul { padding-left: 1.3em; margin: 0.4em 0 0.8em; }
    .doc strong { color: #f2e6c9; font-weight: 650; }
    .wiki {
      color: var(--link);
      border-bottom: 1px dashed rgba(142,196,214,.5);
      cursor: pointer;
    }
    .wiki.missing { color: var(--red); border-bottom-style: dotted; cursor: default; }
    .choice-line {
      display: block;
      margin: 0.55em 0;
      padding: 8px 12px;
      background: rgba(120,132,148,.18);
      border-radius: 8px;
    }
    .choice-label { color: var(--gold); font-weight: 400; }
    .quote-indent {
      margin: 0.45em 0;
      padding: 6px 12px 6px calc(12px + var(--indent, 1) * 1ch);
      border-left: 3px solid rgba(201,161,91,.5);
      background: rgba(120,132,148,.1);
      border-radius: 0 8px 8px 0;
      color: var(--muted);
    }

    .home-hero { max-width: 760px; padding: 28px 4px 60px; position: relative; }
    .home-kicker {
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 10px;
    }
    .home-hero h1 {
      font-size: clamp(28px, 6vw, 42px);
      font-weight: 650;
      letter-spacing: 0.14em;
      color: var(--gold);
      margin: 0 0 12px;
      line-height: 1.2;
    }
    .home-lead { color: var(--muted); font-size: 15px; max-width: 28em; margin-bottom: 28px; }
    .home-stats { display: flex; gap: 28px; margin-bottom: 28px; }
    .home-stats b { display: block; color: var(--gold); font-size: 22px; }
    .home-stats span { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
    .home-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .list-page h2 {
      font-size: 13px;
      letter-spacing: 0.16em;
      color: var(--gold);
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
      margin: 18px 0 8px;
    }
    .list-page a.row {
      display: block;
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--link);
      text-decoration: none;
      font-size: 14px;
    }
    .list-page a.row:hover { background: var(--bg-3); color: var(--gold); }

    .modal-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: min(640px, 100%);
      max-height: min(80vh, 760px);
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }
    .modal h2 { font-size: 16px; margin-bottom: 6px; word-break: break-word; }
    .preview-meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .preview-body {
      flex: 1;
      overflow: auto;
      max-height: 52vh;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 10px 4px 14px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; }

    .home-corner {
      position: fixed;
      right: 14px;
      bottom: calc(14px + var(--safe-bottom));
      z-index: 20;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      pointer-events: none;
    }
    .scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 25;
    }
    .scrim.open { display: block; }

    @media (max-width: 860px) {
      .body { grid-template-columns: 1fr; }
      aside {
        position: fixed;
        top: 53px;
        left: 0;
        bottom: 0;
        width: min(86vw, 320px);
        z-index: 28;
        transform: translateX(-105%);
        box-shadow: var(--shadow);
      }
      .app.sidebar-open aside { transform: translateX(0); }
      .app.sidebar-collapsed aside { transform: translateX(-105%); }
      main { padding: 18px 16px calc(40px + var(--safe-bottom)); }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header>
      <button type="button" class="btn btn-icon" id="btnSidebar" title="侧栏" aria-label="切换侧栏">☰</button>
      <div class="brand" id="goHome">塔卫二档案库</div>
      <div class="search-wrap">
        <input id="q" type="search" placeholder="搜索条目…" autocomplete="off" />
        <div class="search-drop" id="drop"></div>
      </div>
    </header>
    <div class="body">
      <div class="scrim" id="scrim"></div>
      <aside id="aside">
        <div class="home-link" id="navHome" style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;cursor:pointer">
          <div style="color:var(--gold);font-weight:650;font-size:13px;letter-spacing:.1em">首页</div>
        </div>
        <div class="filter-panel">
          <div class="sec-label fold" data-fold="filters"><span class="chev">▾</span>筛选</div>
          <div class="filter-panel-body" id="list-filters">
            <div class="filter-toolbar">
              <div class="mode-switch" id="filterMode">
                <button type="button" class="mode-btn on" data-filter-mode="or">并集</button>
                <button type="button" class="mode-btn" data-filter-mode="and">交集</button>
              </div>
              <span class="clear-link" id="tagClear" hidden>清除筛选</span>
            </div>
            <div class="filter-hint" id="filterModeHint">并集：出现其中一个即可 · 单击切换，可多选</div>
            <div class="sec-label fold" data-fold="form"><span class="chev">▾</span>形式</div>
            <div class="filter-list" id="list-form"></div>
            <div class="sec-label fold collapsed" data-fold="person"><span class="chev">▾</span>人物</div>
            <div class="filter-list collapsed" id="list-person"></div>
            <div class="sec-label fold collapsed" data-fold="place"><span class="chev">▾</span>地点</div>
            <div class="filter-list collapsed" id="list-place"></div>
            <div class="sec-label fold collapsed" data-fold="org"><span class="chev">▾</span>组织</div>
            <div class="filter-list collapsed" id="list-org"></div>
          </div>
        </div>
        <div class="sec-label">条目 <span id="count"></span></div>
        <div id="pages"></div>
      </aside>
      <main>
        <div class="crumb" id="crumb">首页</div>
        <div class="filter-banner" id="filterBanner"></div>
        <h1 class="doc-title" id="title" style="display:none"></h1>
        <div class="meta" id="meta"></div>
        <div class="tag-bar" id="tagBar"></div>
        <div class="doc" id="doc"><p class="empty">正在加载…</p></div>
      </main>
    </div>
  </div>

  <div class="home-corner" id="homeVersion">v—</div>

  <div class="modal-bg" id="previewModal">
    <div class="modal">
      <h2 id="previewTitle">预览</h2>
      <div class="preview-meta" id="previewMeta"></div>
      <div class="preview-body doc" id="previewBody"></div>
      <div class="row">
        <button type="button" class="btn" id="previewClose">关闭</button>
        <button type="button" class="btn primary" id="previewGo">跳转</button>
      </div>
    </div>
  </div>

  <script>
    const FORM_TAGS = new Set(["Baker","中枢档案","任务","多媒体","干员档案","敌人","武器","武器文案","电子档案","纸质记录","藏品","见闻辑录","调查报告"]);
    const PLACE_HINT = ["武陵","四号谷地","塔卫二","帝江号","应龙关","文明环带","枢纽区","塞什卡","甚大裂隙","北部禁区"];
    const WIKI_RE = /\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g;
    const MD_LINK_RE = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
    const URL_RE = /(?<!["'(=])(https?:\/\/[^\s)<]+)/g;

    const $ = (id) => document.getElementById(id);
    const notes = new Map();
    let operators = [];
    let version = "1.0.0";
    let current = "__home__";
    let previewTarget = "";
    let formFilters = new Set();
    let filterMode = localStorage.getItem("ark.public.filterMode") === "and" ? "and" : "or";
    const folds = { filters: false, form: false, person: true, place: true, org: true };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]
      ));
    }

    function tagKind(t) {
      if (FORM_TAGS.has(t)) return "form";
      if (t.endsWith("氏族") || t === "裂地者" || t === "终末地" || t === "罗德岛" || t === "联盟工团") return "org";
      if (PLACE_HINT.some((p) => t === p || t.includes(p))) return "place";
      return "person";
    }

    function tagColor(t) {
      let h = 0;
      for (let i = 0; i < t.length; i++) h = (h * 33 + t.charCodeAt(i)) >>> 0;
      return `hsl(${h % 360} 42% 62%)`;
    }

    function noteTags(title) {
      return (notes.get(title) || {}).tags || [];
    }

    function allTitles() {
      return [...notes.keys()].sort((a, b) => a.localeCompare(b, "zh"));
    }

    function noteMatchesFilters(title) {
      if (!formFilters.size) return true;
      const tags = noteTags(title);
      if (filterMode === "and") return [...formFilters].every((t) => tags.includes(t));
      return tags.some((t) => formFilters.has(t));
    }

    function setFilterMode(mode) {
      filterMode = mode === "and" ? "and" : "or";
      localStorage.setItem("ark.public.filterMode", filterMode);
      document.querySelectorAll("[data-filter-mode]").forEach((btn) => {
        btn.classList.toggle("on", btn.dataset.filterMode === filterMode);
      });
      const hint = $("filterModeHint");
      if (hint) {
        hint.textContent = filterMode === "and"
          ? "交集：须同时带有所选标签 · 单击切换，可多选"
          : "并集：出现其中一个即可 · 单击切换，可多选";
      }
    }

    function clearFilters() {
      formFilters.clear();
      renderSidebar();
      if (current === "__index__") renderIndex();
    }

    function renderInline(src) {
      const store = [];
      let work = String(src ?? "");
      work = work.replace(WIKI_RE, (m, target, alias) => {
        const t = target.trim();
        const label = (alias || t).trim();
        const exists = notes.has(t);
        store.push(`<span class="wiki${exists ? "" : " missing"}" data-wiki="${escapeHtml(t)}">${escapeHtml(label)}</span>`);
        return `\0${store.length - 1}\0`;
      });
      work = work.replace(MD_LINK_RE, (m, label, url) => {
        store.push(`<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`);
        return `\0${store.length - 1}\0`;
      });
      work = work.replace(URL_RE, (url) => {
        store.push(`<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>`);
        return `\0${store.length - 1}\0`;
      });
      return escapeHtml(work)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\0(\d+)\0/g, (_, n) => store[Number(n)]);
    }

    function renderMarkdown(src) {
      const lines = String(src).replace(/\r\n/g, "\n").split("\n");
      const out = [];
      let list = false, para = [];
      const flushP = () => {
        if (!para.length) return;
        out.push("<p>" + para.map(renderInline).join("<br>") + "</p>");
        para = [];
      };
      const closeList = () => { if (list) { out.push("</ul>"); list = false; } };
      for (const line of lines) {
        if (/^#{1,3} /.test(line)) {
          flushP(); closeList();
          const n = line.match(/^(#{1,3}) /)[1].length;
          out.push(`<h${n}>${renderInline(line.slice(n + 1))}</h${n}>`);
        } else if (line.trim() === "---") {
          flushP(); closeList(); out.push("<hr>");
        } else if (/^>\s*选项[：:]/.test(line)) {
          flushP(); closeList();
          const rest = line.replace(/^>\s*选项[：:]\s*/, "");
          out.push(`<div class="choice-line"><span class="choice-label">选项：</span>${renderInline(rest)}</div>`);
        } else if (/^>\*+/.test(line)) {
          flushP(); closeList();
          const m = line.match(/^>(\*+)\s?(.*)$/);
          out.push(`<div class="quote-indent" style="--indent:${m[1].length}">${renderInline(m[2] || "")}</div>`);
        } else if (/^[-*]\s+/.test(line)) {
          flushP();
          if (!list) { out.push("<ul>"); list = true; }
          out.push("<li>" + renderInline(line.replace(/^[-*]\s+/, "")) + "</li>");
        } else if (line.trim() === "") {
          flushP(); closeList();
        } else {
          closeList();
          para.push(line);
        }
      }
      flushP(); closeList();
      return out.join("\n");
    }

    function noteParent(title) {
      return (notes.get(title) || {}).parent || "";
    }

    function buildPageTree(titles) {
      const set = new Set(titles);
      const children = new Map();
      const roots = [];
      for (const t of titles) {
        const p = noteParent(t);
        if (p && set.has(p) && p !== t) {
          if (!children.has(p)) children.set(p, []);
          children.get(p).push(t);
        } else roots.push(t);
      }
      const byZh = (a, b) => a.localeCompare(b, "zh");
      for (const arr of children.values()) arr.sort(byZh);
      roots.sort(byZh);
      return { roots, children };
    }

    function renderPageTreeHtml(nodes, children, depth) {
      let html = "";
      for (const t of nodes) {
        html += `<div class="page-item${t === current ? " on" : ""}" data-go="${escapeHtml(t)}" style="--depth:${depth}">${escapeHtml(t)}</div>`;
        const kids = children.get(t) || [];
        if (kids.length) html += renderPageTreeHtml(kids, children, depth + 1);
      }
      return html;
    }

    function countsOfKind(kind) {
      const m = new Map();
      for (const n of notes.values()) {
        for (const t of n.tags || []) {
          if (tagKind(t) === kind) m.set(t, (m.get(t) || 0) + 1);
        }
      }
      return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "zh"));
    }

    function renderSidebar() {
      $("navHome").classList.toggle("on", current === "__home__");
      setFilterMode(filterMode);
      $("tagClear").hidden = formFilters.size === 0;
      for (const [kind, empty] of [["form","无"],["person","无"],["place","无"],["org","无"]]) {
        const el = $("list-" + kind);
        const rows = countsOfKind(kind);
        el.innerHTML = rows.length
          ? rows.map(([t, n]) =>
              `<div class="tag-row${formFilters.has(t) ? " on" : ""}" data-filter-tag="${escapeHtml(t)}">
                <span class="nm" style="color:${tagColor(t)}">#${escapeHtml(t)}</span><span class="n">${n}</span>
              </div>`
            ).join("")
          : `<div class="empty">${empty}</div>`;
      }
      let list = allTitles();
      if (formFilters.size) list = list.filter(noteMatchesFilters);
      $("count").textContent = `(${list.length})`;
      if (!list.length) {
        $("pages").innerHTML = `<div class="empty">没有符合筛选的条目</div>`;
      } else {
        const { roots, children } = buildPageTree(list);
        $("pages").innerHTML = renderPageTreeHtml(roots, children, 0);
      }
      const banner = $("filterBanner");
      if (formFilters.size) {
        const names = [...formFilters].map((t) => "#" + t).join(" · ");
        const modeLabel = filterMode === "and" ? "交集" : "并集";
        banner.classList.add("show");
        banner.innerHTML = `${modeLabel}筛选 <b>${escapeHtml(names)}</b> · 点此清除`;
      } else {
        banner.classList.remove("show");
        banner.innerHTML = "";
      }
      document.querySelectorAll("[data-fold]").forEach((el) => {
        const key = el.dataset.fold;
        el.classList.toggle("collapsed", !!folds[key]);
        const body = key === "filters" ? $("list-filters") : $("list-" + key);
        if (body) body.classList.toggle("collapsed", !!folds[key]);
      });
    }

    function closeMobileSidebar() {
      $("app").classList.remove("sidebar-open");
      $("scrim").classList.remove("open");
    }

    function setHash(path) {
      history.pushState(null, "", path);
    }

    function renderHome() {
      current = "__home__";
      $("title").style.display = "none";
      $("title").textContent = "";
      $("crumb").textContent = "首页";
      $("meta").textContent = "";
      $("tagBar").innerHTML = "";
      $("doc").innerHTML = `<div class="home-hero">
        <div class="home-kicker">Arknights: Endfield</div>
        <h1>塔卫二档案库</h1>
        <p class="home-lead">《明日方舟：终末地》文字剧情档案（公开只读）</p>
        <div class="home-stats">
          <div><b>${notes.size}</b><span>条目</span></div>
          <div><b>${operators.length}</b><span>干员</span></div>
        </div>
        <div class="home-actions">
          <button type="button" class="btn primary" data-open-ops>干员</button>
          <button type="button" class="btn" data-open-index>全部条目</button>
        </div>
      </div>`;
      $("homeVersion").textContent = "v" + version;
      renderSidebar();
      setHash("#/");
      document.querySelector("main").scrollTop = 0;
      closeMobileSidebar();
    }

    function renderOperators() {
      current = "__ops__";
      $("title").style.display = "";
      $("title").textContent = "干员";
      $("crumb").textContent = "首页 / 干员";
      $("meta").innerHTML = `共 <i>${operators.length}</i> 名（带「干员档案」标签）`;
      $("tagBar").innerHTML = "";
      const rows = operators.map((t) =>
        `<a class="row" href="#/op/${encodeURIComponent(t)}" data-open-op="${escapeHtml(t)}">${escapeHtml(t)}</a>`
      ).join("");
      $("doc").innerHTML = `<div class="list-page">${rows || '<div class="empty">暂无干员档案</div>'}</div>`;
      renderSidebar();
      setHash("#/ops");
      document.querySelector("main").scrollTop = 0;
      closeMobileSidebar();
    }

    function renderOperatorNotes(name) {
      if (!operators.includes(name) && !notes.has(name)) {
        renderOperators();
        return;
      }
      current = "__op__:" + name;
      const related = allTitles().filter((t) => noteTags(t).includes(name));
      $("title").style.display = "";
      $("title").textContent = name;
      $("crumb").textContent = "首页 / 干员 / " + name;
      $("meta").innerHTML = `相关条目 <i>${related.length}</i>`;
      $("tagBar").innerHTML = "";
      const head = notes.has(name)
        ? `<p class="empty" style="margin-bottom:12px"><span class="wiki" data-wiki="${escapeHtml(name)}">查看「${escapeHtml(name)}」档案正文</span></p>`
        : "";
      const rows = related.map((t) =>
        `<a class="row" href="#/p/${encodeURIComponent(t)}" data-go="${escapeHtml(t)}">${escapeHtml(t)}</a>`
      ).join("");
      $("doc").innerHTML = `<div class="list-page">${head}<h2>相关条目</h2>${rows || '<div class="empty">暂无相关条目</div>'}</div>`;
      renderSidebar();
      setHash("#/op/" + encodeURIComponent(name));
      document.querySelector("main").scrollTop = 0;
      closeMobileSidebar();
    }

    function indexBucket(title) {
      let s = String(title || "").trim().replace(/^任务[：:]/, "");
      if (!s) return "#";
      const ch = s.charAt(0);
      if (/[A-Za-z]/.test(ch)) return ch.toUpperCase();
      if (!/[\u4e00-\u9fff]/.test(ch)) return "#";
      const marks = "阿八嚓大额发噶哈讥咔拉妈拿哦啪七然撒塌挖昔压匝";
      const letters = "ABCDEFGHJKLMNOPQRSTWXYZ";
      for (let i = letters.length - 1; i >= 0; i--) {
        if (ch.localeCompare(marks[i], "zh") >= 0) return letters[i];
      }
      return "A";
    }

    function renderIndex() {
      current = "__index__";
      let list = allTitles();
      if (formFilters.size) list = list.filter(noteMatchesFilters);
      list = list.sort((a, b) => a.localeCompare(b, "zh"));
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      const buckets = new Map([...letters, "#"].map((L) => [L, []]));
      for (const t of list) buckets.get(indexBucket(t)).push(t);
      const sections = [];
      for (const L of [...letters, "#"]) {
        const items = buckets.get(L) || [];
        if (!items.length) continue;
        sections.push(`<h2 id="idx-${L}">${L === "#" ? "# 其它" : L}</h2>` +
          items.map((t) => `<a class="row" href="#/p/${encodeURIComponent(t)}" data-go="${escapeHtml(t)}">${escapeHtml(t)}</a>`).join(""));
      }
      $("title").style.display = "";
      $("title").textContent = "全部条目";
      $("crumb").textContent = "首页 / 全部条目";
      $("meta").innerHTML = `共 <i>${list.length}</i> 条`;
      $("tagBar").innerHTML = "";
      $("doc").innerHTML = `<div class="list-page">${sections.join("") || '<div class="empty">无</div>'}</div>`;
      renderSidebar();
      setHash("#/index");
      document.querySelector("main").scrollTop = 0;
      closeMobileSidebar();
    }

    function openPage(title) {
      if (!notes.has(title)) return;
      current = title;
      const n = notes.get(title);
      $("title").style.display = "";
      $("title").textContent = title;
      $("crumb").textContent = "档案库 / " + title;
      const words = (n.content || "").replace(/\s/g, "").length;
      $("meta").innerHTML = `<i>${words}</i> 字`;
      $("tagBar").innerHTML = (n.tags || []).map((t) =>
        `<span class="tag" data-filter-tag="${escapeHtml(t)}" style="border-color:${tagColor(t)};color:${tagColor(t)}">#${escapeHtml(t)}</span>`
      ).join("");
      $("doc").innerHTML = renderMarkdown(n.content) || `<p class="empty">这篇是空的。</p>`;
      renderSidebar();
      setHash("#/p/" + encodeURIComponent(title));
      document.querySelector("main").scrollTop = 0;
      closeMobileSidebar();
    }

    function openWikiPreview(title) {
      previewTarget = title;
      $("previewTitle").textContent = title;
      if (!notes.has(title)) {
        $("previewMeta").textContent = "条目不存在";
        $("previewBody").innerHTML = `<p class="empty">公开库中没有这篇。</p>`;
        $("previewGo").hidden = true;
      } else {
        const n = notes.get(title);
        $("previewMeta").textContent = `${(n.content || "").replace(/\s/g, "").length} 字`;
        $("previewBody").innerHTML = renderMarkdown(n.content) || `<p class="empty">空</p>`;
        $("previewGo").hidden = false;
        $("previewBody").scrollTop = 0;
      }
      $("previewModal").classList.add("open");
    }

    function search(q) {
      q = q.trim().toLowerCase();
      if (!q) return [];
      const hits = [];
      for (const [title, n] of notes) {
        const body = n.content || "";
        const inTitle = title.toLowerCase().includes(q);
        const idx = body.toLowerCase().indexOf(q);
        if (!inTitle && idx < 0) continue;
        let snip = "";
        if (idx >= 0) {
          const a = Math.max(0, idx - 20);
          snip = (a > 0 ? "…" : "") + body.slice(a, idx + q.length + 40).replace(/\s+/g, " ");
        }
        hits.push({ title, snippet: snip || title, score: (inTitle ? 10 : 0) + (idx >= 0 ? 1 : 0) });
      }
      hits.sort((a, b) => b.score - a.score || a.title.localeCompare(b.title, "zh"));
      return hits.slice(0, 40);
    }

    function routeFromHash() {
      const h = decodeURIComponent(location.hash || "#/");
      if (!h || h === "#" || h === "#/") { renderHome(); return; }
      if (h === "#/ops") { renderOperators(); return; }
      if (h === "#/index") { renderIndex(); return; }
      let m = h.match(/^#\/op\/(.+)$/);
      if (m) { renderOperatorNotes(m[1]); return; }
      m = h.match(/^#\/p\/(.+)$/);
      if (m && notes.has(m[1])) { openPage(m[1]); return; }
      renderHome();
    }

    function bind() {
      $("btnSidebar").onclick = () => {
        const app = $("app");
        if (window.matchMedia("(max-width: 860px)").matches) {
          const open = app.classList.toggle("sidebar-open");
          $("scrim").classList.toggle("open", open);
        } else {
          app.classList.toggle("sidebar-collapsed");
        }
      };
      $("scrim").onclick = closeMobileSidebar;
      $("goHome").onclick = () => renderHome();
      $("navHome").onclick = () => renderHome();
      $("tagClear").onclick = () => clearFilters();
      $("filterBanner").onclick = () => clearFilters();
      $("filterMode").onclick = (e) => {
        const btn = e.target.closest("[data-filter-mode]");
        if (!btn) return;
        setFilterMode(btn.dataset.filterMode);
        renderSidebar();
        if (current === "__index__") renderIndex();
      };
      $("previewClose").onclick = () => $("previewModal").classList.remove("open");
      $("previewGo").onclick = () => {
        const t = previewTarget;
        $("previewModal").classList.remove("open");
        if (t && notes.has(t)) openPage(t);
      };
      $("previewModal").onclick = (e) => { if (e.target === $("previewModal")) $("previewModal").classList.remove("open"); };

      document.body.addEventListener("click", (e) => {
        const fold = e.target.closest("[data-fold]");
        if (fold) {
          const key = fold.dataset.fold;
          folds[key] = !folds[key];
          renderSidebar();
          return;
        }
        const ft = e.target.closest("[data-filter-tag]");
        if (ft) {
          const t = ft.dataset.filterTag;
          if (formFilters.has(t)) formFilters.delete(t);
          else formFilters.add(t);
          renderSidebar();
          if (current === "__index__") renderIndex();
          return;
        }
        if (e.target.closest("[data-open-ops]")) { renderOperators(); return; }
        if (e.target.closest("[data-open-index]")) { renderIndex(); return; }
        const op = e.target.closest("[data-open-op]");
        if (op) { renderOperatorNotes(op.dataset.openOp); return; }
        const go = e.target.closest("[data-go]");
        if (go) { openPage(go.dataset.go); $("drop").classList.remove("open"); return; }
        const wiki = e.target.closest("[data-wiki]");
        if (wiki) { openWikiPreview(wiki.dataset.wiki); return; }
      });

      $("q").addEventListener("input", () => {
        const q = $("q").value;
        const drop = $("drop");
        if (!q.trim()) { drop.classList.remove("open"); drop.innerHTML = ""; return; }
        const hits = search(q);
        drop.innerHTML = hits.length
          ? hits.map((h, i) => `<div class="hit${i===0?" active":""}" data-go="${escapeHtml(h.title)}"><div class="t">${escapeHtml(h.title)}</div><div class="s">${escapeHtml(h.snippet)}</div></div>`).join("")
          : `<div class="hit"><div class="t">没有匹配</div></div>`;
        drop.classList.add("open");
      });
      $("q").addEventListener("keydown", (e) => {
        if (e.key === "Escape") $("drop").classList.remove("open");
        if (e.key === "Enter") {
          const first = $("drop").querySelector("[data-go]");
          if (first) openPage(first.dataset.go);
          $("drop").classList.remove("open");
        }
      });
      document.addEventListener("click", (e) => {
        if (!e.target.closest(".search-wrap")) $("drop").classList.remove("open");
      });
      window.addEventListener("popstate", routeFromHash);
      window.addEventListener("resize", () => {
        if (!window.matchMedia("(max-width: 860px)").matches) {
          $("scrim").classList.remove("open");
          $("app").classList.remove("sidebar-open");
        }
      });
    }

    async function boot() {
      bind();
      try {
        const res = await fetch("data/notes.json");
        if (!res.ok) throw new Error("load failed");
        const data = await res.json();
        version = data.version || version;
        operators = data.operators || [];
        for (const n of data.notes || []) {
          notes.set(n.title, { title: n.title, content: n.content || "", tags: n.tags || [], parent: n.parent || "" });
        }
        // 若未预计算 operators，现场生成
        if (!operators.length) {
          operators = allTitles().filter((t) => noteTags(t).includes("干员档案"));
        }
        operators = [...operators].sort((a, b) => a.localeCompare(b, "zh"));
        $("homeVersion").textContent = "v" + version;
        routeFromHash();
      } catch (err) {
        $("doc").innerHTML = `<p class="empty">无法加载 data/notes.json。请先在仓库根目录运行 <code>python build_public_site.py</code>，再用本地静态服务器或 GitHub Pages 打开。</p>`;
      }
    }

    boot();
  </script>
</body>
</html>
